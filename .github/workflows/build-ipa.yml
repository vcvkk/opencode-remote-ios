name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # macOS 26 ships Xcode 26.x and the iOS 26.5 SDK — stable, and safe to
    # build against for a device on a newer iOS beta.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: app
        run: xcodegen generate

      - name: Build unsigned IPA
        working-directory: app
        env:
          MARKETING_VERSION: 1.0.0
          CURRENT_PROJECT_VERSION: 1
        run: |
          set -o pipefail
          xcodebuild \
            -project RemoteForOpenCode.xcodeproj \
            -scheme Phone \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            build | xcbeautify || \
          xcodebuild \
            -project RemoteForOpenCode.xcodeproj \
            -scheme Phone \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          # The product is named after the target (Phone.app); CFBundleDisplayName
          # only changes what the Home screen shows. Pick whatever .app landed
          # rather than hardcoding, so a rename upstream cannot break packaging.
          APP="$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "no .app under Release-iphoneos"
            exit 1
          fi
          echo "packaging: $APP"
          STAGE="$RUNNER_TEMP/ipa"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          # An unsigned build keeps no _CodeSignature; zsign writes it locally.
          rm -rf "$STAGE/Payload/$(basename "$APP")/_CodeSignature"
          (cd "$STAGE" && zip -qry "$RUNNER_TEMP/RemoteForOpenCode-unsigned.ipa" Payload)
          unzip -l "$RUNNER_TEMP/RemoteForOpenCode-unsigned.ipa" | head -5

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RemoteForOpenCode-unsigned
          path: ${{ runner.temp }}/RemoteForOpenCode-unsigned.ipa
          if-no-files-found: error

  test:
    # The QR payload is the entire pairing handshake now that CloudKit is
    # gone, so its round trip is pinned by tests rather than by eye.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Run RemoteKit tests
        working-directory: packages/RemoteKit
        # No `| tail` here: piping hides the exit status, which is how a
        # failing test run came back green. Capture and print, keep the code.
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/test.log | tail -60
